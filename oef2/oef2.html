<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smurfenboek</title>
    <link rel="stylesheet" href="oef2.css">
</head>
<body>
    <table> 
        <caption>Smurfenstatistieken</caption>
        <thead class="foot">
        <tr class="center">
            <td rowspan="2"><i>Smurf</i></td>
            <td colspan ="2"><i>Activiteiten per week</i></td>
            <td rowspan = "2"><i>Favoriete kleur</i></td>
        </tr>
        <tr class="center">
            <td><i>Avonturen</i></td>
            <td><i>Uitvindingen</i></td>
        </tr>
    </thead>
<tbody>
        <tr>
            <td class="center">Grote smurf</td>
            <td>3</td>
            <td>1</td>
            <td scope="rood">Rood</td>
        </tr>
        <tr>
            <td class="center">Brilsmurf</td>
            <td>2</td>
            <td>2</td>
            <td scope="geel">Geel</td>
        </tr>
        <tr>
            <td class="center">Knutselsmurf</td>
            <td>1</td>
            <td>4</td>
            <td scope="rood">Rood</td>
        </tr>
        </tbody>
        <tfoot>
        <tr class="foot">
            <td class="center"><i>Totaal</i></td>
            <td><i>6</i></td>
            <td><i>7</i></td>
            <td><i>  2 kleuren</i></td>
        </tr>
        </tfoot>       
    </table>

</body>
</html>
